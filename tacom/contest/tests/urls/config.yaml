# ── Exclusions ──────────────────────────────────────────────
exclude:
  apps:
    - "admin"
    - "debug_toolbar"
  modules:
    - "django.conf.urls.i18n"
    - "paypal.standard.ipn.urls"
    - "tinymce.urls"
    - "rosetta.urls"
    - "allauth.socialaccount.urls"
  names:
    - "account_logout"
    - "account_email"
    - "account_email_verification_sent"
    - "account_confirm_email"
    - "account_inactive"
    - "account_signup"
    - "account_reauthenticate"
    - "account_reset_password"
    - "account_reset_password_done"
    - "account_reset_password_from_key"
    - "account_reset_password_from_key_done"
    - "account_confirm_login_code"
    - "account_set_password"
  namespaces:
    - "rosetta"

# ── Capability class ─────────────────────────────────────────
capability_class: "contest.permissions.capabilities.Capability"

# ── Data provider class ──────────────────────────────────────
data_provider_class: "contest.tests.urls.data_provider.ContestDataProvider"

# ── Method testing strategy ──────────────────────────────────
method_strategy:
  mode: "RESTRICT_TO_CONFIG"
  methods: ["GET", "POST"]

# ── Statistics ───────────────────────────────────────────────
stats:
  enabled: true
  db_path: "./stats.db"
  cleanup_on_start: false
  soft_response_time_ms: 1000

# ── Defaults ─────────────────────────────────────────────────
defaults:
  anonymous:
    access_rules:
#      - any_success: true
      - status_codes: [200]

  logged_in:
    access_rules:
      - status_codes: [200]
    no_access_rules:
      - status_codes: [302, 404]
        allowed_redirect_targets:
          - names: ["account_login"]

  by_capability:
    access_rules:
      - status_codes: [200]
    no_access_rules:
      - status_codes: [302, 404]
        allowed_redirect_targets:
          - name_space: "contest"
            names: ["contest_detail", "contest_list"]

  by_group:
    access_rules:
      - any_success: true
    no_access_rules:
      - status_codes: [302, 404]
        allowed_redirect_targets:
          - names: ["account_login"]

# ── Anonymous URLs ───────────────────────────────────────────
anonymous:
  - routes:
      - names: [ "home" ]
    access_rules:
      - any_success: true


  - routes:
      - names: ["account_login"]

  - routes:
      - name_space: "contest"
        names:
          - "contest_list"
          - "contest_detail"
          - "contest_rules"
          - "contest_address"
          - "style_detail"
          - "privacy"
          - "partners_gallery"
          - "contest_results"

# ── Logged-in URLs ───────────────────────────────────────────
logged_in:
  - routes:
      - names: ["account_change_password"]

  - routes:
      - name_space: "contest"
        names:
          - "profile"
          - "profile_edit"
          - "add_entry_category"
          - "user_entry_list"
          - "judge_application"
          - "judge_certification_read"
          - "judge_certification_edit"
          - "judge_application_widget"
          - "judge_widget_apply"
          - "judge_widget_cancel"
          - "add_entry"
          - "add_entry_contest"
          - "payment_start"
          - "labels_start"



# ── By capability ────────────────────────────────────────────
by_capability:
  JUDGE_FINALS:
    - routes:
        - name_space: "contest"
          names:
            - "judging_finals_list"
            - "judging_finals_category"

  JUDGE_BOS:
    - routes:
        - name_space: "contest"
          names:
            - "judging_bos_view"

    # bos_select (after editing) redirects to bos_view
    - routes:
        - name_space: "contest"
          names:
            - "judging_bos_select"
      access_rules:
        - status_codes: [200, 302]
          allowed_redirect_targets:
          - name_space: "contest"
            names: ["contest:judging_bos_view"]

  VIEW_JUDGING_ENTRIES_LIST:
    - routes:
        - name_space: "contest"
          names:
            - "judging_list"

  VIEW_SCORESHEET:
    - routes:
        - name_space: "contest"
          names:
            - "scoresheet_view"

  EDIT_SCORESHEET:
    - routes:
        - name_space: "contest"
          names:
            - "scoresheet_edit"
            - "scoresheet_create"

  ENTRY_PAYMENTS:
    - routes:
        - name_space: "contest"
          names:
            - "payment_list"
    - routes:
        - name_space: "contest"
          names:
            - "payment_process"
      access_rules:
        - status_codes: [200, 302]
          allowed_redirect_targets:
          - name_space: "contest"
            names: ["contest:payment_list"]

  ENTRY_RECEIVE:
    - routes:
        - name_space: "contest"
          names:
            - "delivery_select"
    - routes:
        - name_space: "contest"
          names:
            - "delivery_process"
      access_rules:
        - status_codes: [200, 302]
          allowed_redirect_targets:
          - name_space: "contest"
            names: ["contest:delivery_process"]

  CONTEST_MANAGE_JUDGES:
    - routes:
        - name_space: "contest"
          names:
            - "judge_selection_list"
            - "judge_status_edit"
            - "judge_status_view"
            - "judge_phases_list"
            - "toggle_contest_role"


# ── Parked URLs (deferred / known issues) ────────────────────
parked:
  - name_space: "contest"
    names:
      # webhook (csrf-exempt, not user-facing)
      - "payment_payu_notification"
      # ownership-based access (beyond framework scope for v1.0)
      - "entry_edit"
      - "entry_delete"
      - "entry_results"
      # complex payment flows requiring payment objects / payment methods
      - "payment_method_selection"
      - "payment_fake"
      - "payment_transfer"
      - "payment_payu"
      - "payment_payu_redirect"
      - "payment_paypal"
      - "payment_paypal_success"
      - "payment_paypal_failure"
      # own-package check (beyond framework scope for v1.0)
      - "labels_print"
      # incomplete/buggy view (TODO in code)
      - "disambiguation"
